name: Generate Snake

permissions:
  contents: write

on:
  # Executa a cada 12 horas automaticamente
  schedule:
    - cron: "0 */12 * * *"
  # Permite rodar a action manualmente a qualquer momento
  workflow_dispatch:
  # Roda também quando houver um push na main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Snake Game from Contributions
        uses: Platane/snk@v3
        with:
          github_user_name: ThiagoIrrazabal
          # Gera duas versões: uma para o tema claro e outra para o tema escuro
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push Snake Game to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
